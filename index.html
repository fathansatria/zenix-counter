<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenix Arrival</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 24px 20px; text-align: center;
  }
  img {
    display: block; width: auto; height: auto; max-width: min(100%, 900px); max-height: 52vh;
    -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent);
            mask-image: radial-gradient(closest-side, #000 55%, transparent);
  }
  .name { margin-top: 8px; font-size: clamp(12px, 1.2vw, 16px); letter-spacing: .4em; text-transform: uppercase; color: #888; }
  .timer {
    margin-top: 2vh; font-weight: 200; line-height: 1; letter-spacing: -.02em;
    font-size: min(18vw, 30vh); font-variant-numeric: tabular-nums;
  }
  .timer span { color: #555; }
  .credit { position: fixed; bottom: 8px; left: 0; right: 0; font-size: 10px; color: #333; }
  .credit a { color: inherit; }
  .eta { margin-top: 2vh; font-size: clamp(12px, 1.2vw, 16px); color: #888; letter-spacing: .1em; }
</style>
</head>
<body>
  <img src="zenix.jpg" alt="Toyota Zenix hitam" width="1200" height="754">
  <div class="name">Toyota Zenix</div>
  <div class="timer" id="timer">00<span>:</span>00<span>:</span>00</div>
  <div class="eta" id="eta">Tiba pukul 15.00 WIB</div>
  <div class="credit">Foto: オーバードライブ83 / <a href="https://commons.wikimedia.org/wiki/File:2022_Toyota_Kijang_Innova_Zenix_2.0_V_MAGA10R_(20230709).jpg">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a></div>

<script>
  // Arrival 15:00 WIB = 08:00 UTC. Override with ?at=YYYY-MM-DDTHH:MM (WIB) for testing.
  const at = new URLSearchParams(location.search).get('at');
  const target = (at && Date.parse(at + ':00+07:00')) || Date.UTC(2026, 9, 15, 8, 0, 0);
  const timer = document.getElementById('timer');
  const pad = n => String(n).padStart(2, '0');
  const sep = '<span>:</span>';

  function tick() {
    const s = Math.max(0, Math.ceil((target - Date.now()) / 1000));
    if (s === 0) {
      timer.style.fontSize = 'min(9vw, 16vh)';
      timer.textContent = 'Selamat Datang';
      document.getElementById('eta').textContent = 'Zenix telah tiba';
      return;
    }
    const h = Math.floor(s / 3600);
    timer.innerHTML = pad(h) + sep + pad(Math.floor(s / 60) % 60) + sep + pad(s % 60);
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();
</script>
</body>
</html>
