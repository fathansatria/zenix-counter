<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenix Arrival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff; --text: #111; --muted: #6b6b6b; --accent: #ff5b3e; --surface: #ffd84d; --border: #dedede;
    --head: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--body);
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    padding: clamp(20px, 3.5vh, 44px) clamp(20px, 4vw, 72px);
  }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .eyebrow { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 {
    margin: 0; font-family: var(--head); font-weight: 400;
    font-size: clamp(30px, 4.2vw, 64px); line-height: 1.08; letter-spacing: -.03em;
  }
  .arrived h1 { font-size: clamp(40px, 7vw, 120px); }
  .lede { margin: 10px 0 0; font-size: clamp(15px, 1.3vw, 20px); line-height: 1.55; color: var(--muted); }
  img { display: block; width: auto; height: auto; max-width: min(100%, 860px); max-height: 36vh; margin: clamp(8px, 2vh, 24px) 0; }

  .timer { display: flex; align-items: flex-start; justify-content: center; gap: clamp(6px, 1.5vw, 24px); }
  .timer[hidden] { display: none; }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .num, .colon {
    font-family: var(--head); font-weight: 400; line-height: 1; letter-spacing: -.035em;
    font-size: min(15vw, 22vh); font-variant-numeric: tabular-nums;
  }
  .colon { color: var(--accent); }
  .label { margin-top: 6px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  footer {
    display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap;
    padding-top: 14px; border-top: 1px solid var(--border); font-size: 13px; letter-spacing: .04em; color: var(--muted);
  }
  footer b { color: var(--text); font-weight: 500; }

  @media (max-width: 600px) {
    header { flex-direction: column; }
    header, footer { justify-content: center; text-align: center; }
    .num, .colon { font-size: 20vw; }
    .label { font-size: 11px; }
  }
</style>
</head>
<body>
  <header>
    <span class="eyebrow">Armada Baru · Kamis, 15 Oktober 2026</span>
    <span class="pill"><i></i><span id="status">Dalam perjalanan</span></span>
  </header>

  <main>
    <h1 id="headline">Sebentar lagi, Zenix tiba.</h1>
    <p class="lede" id="lede">Anggota baru armada kita sedang dalam perjalanan ke kantor.</p>
    <img src="zenix.jpg" alt="Toyota Kijang Innova Zenix Hybrid EV warna hitam" width="1024" height="607">
    <div class="timer" id="timer">
      <div class="unit"><span class="num" id="h">00</span><span class="label">Jam</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="m">00</span><span class="label">Menit</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="s">00</span><span class="label">Detik</span></div>
    </div>
  </main>

  <footer>
    <span>Kijang Innova Zenix Hybrid EV · <b>Attitude Black</b></span>
    <span>Tiba pukul <b>16.00 WIB</b></span>
  </footer>

<script>
  // Arrival 16:00 WIB = 09:00 UTC.
  const target = Date.UTC(2026, 9, 15, 9, 0, 0);
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const s = Math.max(0, Math.ceil((target - Date.now()) / 1000));
    if (s === 0) {
      $('status').textContent = 'Sudah tiba';
      $('headline').textContent = 'Selamat datang, Zenix.';
      $('lede').textContent = 'Armada baru kita sudah di kantor. Yuk, sambut bersama.';
      $('timer').hidden = true;
      document.body.classList.add('arrived');
      return;
    }
    $('h').textContent = pad(Math.floor(s / 3600));
    $('m').textContent = pad(Math.floor(s / 60) % 60);
    $('s').textContent = pad(s % 60);
    if (s <= 600) $('status').textContent = 'Segera tiba';
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();
</script>
</body>
</html>
