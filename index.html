<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenix Arrival</title>
<link rel="preload" as="image" href="zenix.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #050505;
    --gold: #d4b370;
    --gold-hi: #f3dfa6;
    --gold-lo: #8a6d33;
    --text: #f1ede4;
    --muted: #9a9385;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--text); font-family: var(--sans);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  /* ---------- photo ---------- */
  .hero {
    position: fixed; inset: 0 0 auto 0; height: 66vh; height: 66dvh; overflow: hidden; z-index: 0;
    display: flex; justify-content: center;
  }
  .hero img { /* whole car visible; photo edges dissolve into black */
    height: 100%; width: auto; max-width: 100%; object-fit: cover; object-position: 55% 50%; display: block;
    filter: brightness(.8) contrast(1.12) saturate(.75);
    -webkit-mask-image: radial-gradient(closest-side, #000 50%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 50%, transparent 100%);
    animation: kenburns 30s ease-in-out infinite alternate, fade-in 2.2s ease-out both;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(5,5,5,.35) 0%, transparent 25%, transparent 70%, var(--ink) 100%);
  }

  #sparks { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ---------- layout ---------- */
  .stage {
    position: relative; z-index: 2; height: 100vh; height: 100dvh;
    display: grid; grid-template-rows: auto 1fr auto auto;
    padding: max(28px, env(safe-area-inset-top)) clamp(20px, 4vw, 64px) max(20px, env(safe-area-inset-bottom));
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: clamp(10px, 1vw, 13px); letter-spacing: .45em; text-transform: uppercase; color: var(--gold); }
  h1 {
    margin: 10px 0 0; font-family: var(--serif); font-weight: 500; line-height: .9;
    font-size: clamp(38px, 5.4vw, 96px);
    background: linear-gradient(180deg, #fff 0%, var(--gold-hi) 50%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 24px rgba(0,0,0,.6));
  }
  h1 em { font-style: italic; }
  .tagline { margin-top: 8px; font-size: clamp(11px, 1vw, 14px); letter-spacing: .14em; color: rgba(241,237,228,.75); }
  .status {
    display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px;
    border: 1px solid rgba(212,179,112,.35); background: rgba(5,5,5,.45); backdrop-filter: blur(10px);
    font-size: clamp(11px, 1vw, 14px); letter-spacing: .22em; text-transform: uppercase; color: var(--gold-hi);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.8s infinite; }
  header > *, .timer, .meta { opacity: 0; animation: rise 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
  header > :nth-child(2) { animation-delay: .3s; }
  .timer { animation-delay: .6s; }
  .meta { animation-delay: .9s; }

  /* ---------- the big timer ---------- */
  .timer {
    grid-row: 3; display: flex; justify-content: center; align-items: flex-start;
    gap: clamp(4px, 1.4vw, 28px); margin-bottom: clamp(10px, 2.5vh, 32px);
  }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .unit[hidden], .unit[hidden] + .colon { display: none; }
  .digits {
    font-family: var(--serif); font-weight: 500; line-height: .82;
    font-size: min(21vw, 34vh);
    font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1;
    filter: drop-shadow(0 10px 40px rgba(0,0,0,.85));
    letter-spacing: -.01em;
  }
  .has-days .digits { font-size: min(16vw, 30vh); }
  .digits span { /* gradient lives on the span: Chrome drops parent background-clip:text on animated children */
    display: inline-block;
    background: linear-gradient(180deg, #ffffff 0%, #f6ecd2 40%, var(--gold-hi) 62%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .digits span.tick { animation: tick .35s cubic-bezier(.2,.8,.2,1); }
  .label {
    margin-top: clamp(6px, 1.4vh, 16px); padding-left: .5em;
    font-size: clamp(10px, 1.1vw, 16px); letter-spacing: .5em; text-transform: uppercase; color: var(--muted);
  }
  .colon {
    font-family: var(--serif); font-weight: 500; line-height: .82; font-size: min(15vw, 24vh);
    color: var(--gold); opacity: .6; animation: blink 1s steps(1) infinite;
  }

  .meta {
    grid-row: 4; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 24px;
    padding-top: 14px; border-top: 1px solid rgba(212,179,112,.18);
    font-size: clamp(11px, 1vw, 14px); letter-spacing: .08em; color: var(--muted);
  }
  .meta b { color: var(--text); font-weight: 500; }
  .credit { font-size: 10px; letter-spacing: .04em; color: rgba(154,147,133,.55); }
  .credit a { color: inherit; }

  /* ---------- arrived ---------- */
  .welcome { display: none; grid-row: 3; text-align: center; margin-bottom: clamp(10px, 3vh, 40px); }
  .arrived .timer { display: none; }
  .arrived .welcome { display: block; animation: rise 1.6s cubic-bezier(.2,.7,.2,1) both; }
  .welcome .big {
    font-family: var(--serif); font-style: italic; font-weight: 500; line-height: .95;
    font-size: min(8vw, 17vh); white-space: nowrap;
    background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi), #fff, var(--gold-hi), var(--gold-lo));
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 4s linear infinite; filter: drop-shadow(0 10px 40px rgba(0,0,0,.85));
  }
  .welcome p { margin: 14px 0 0; color: rgba(241,237,228,.8); letter-spacing: .14em; font-size: clamp(13px, 1.4vw, 20px); }

  @media (max-aspect-ratio: 1/1) { /* portrait phones & tablets */
    .hero { height: 54vh; height: 54dvh; }
    .hero img { width: 100%; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
    .stage { grid-template-rows: auto 1fr auto .25fr auto; }
    .hero::after { background: linear-gradient(180deg, rgba(5,5,5,.85) 0%, rgba(5,5,5,.2) 30%, transparent 60%, var(--ink) 100%); }
    .welcome .big { font-size: 13vw; white-space: normal; }
    .meta { grid-row: 5; }
    .digits { font-size: 25vw; }
    .has-days .digits { font-size: 19vw; }
    .colon { font-size: 16vw; }
    .label { letter-spacing: .3em; }
    .meta { justify-content: center; text-align: center; }
  }

  @keyframes rise { from { opacity: 0; transform: translateY(20px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.06); } }
  @keyframes tick { from { transform: translateY(-10%); opacity: .35; filter: blur(2px); } to { transform: none; opacity: 1; filter: none; } }
  @keyframes blink { 50% { opacity: .15; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212,179,112,.6); } 70% { box-shadow: 0 0 0 10px rgba(212,179,112,0); } 100% { box-shadow: 0 0 0 0 rgba(212,179,112,0); } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="hero" aria-hidden="true">
  <img src="zenix.jpg" alt="">
</div>
<canvas id="sparks"></canvas>

<main class="stage" id="stage">
  <header>
    <div>
      <div class="eyebrow">Kedatangan Armada Baru</div>
      <h1>Toyota <em>Zenix</em></h1>
      <div class="tagline">Attitude Black Mica</div>
    </div>
    <div class="status"><i class="dot"></i><span id="status-text">Dalam Perjalanan</span></div>
  </header>

  <section class="timer" id="timer" aria-live="polite">
    <div class="unit" id="u-days" hidden><div class="digits" id="d-days"><span>00</span></div><div class="label">Hari</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="digits" id="d-hours"><span>00</span></div><div class="label">Jam</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="digits" id="d-mins"><span>00</span></div><div class="label">Menit</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="digits" id="d-secs"><span>00</span></div><div class="label">Detik</div></div>
  </section>

  <div class="welcome">
    <div class="big">Selamat Datang, Zenix</div>
    <p>Armada baru kita telah tiba. Mari sambut bersama.</p>
  </div>

  <div class="meta">
    <span>Tiba <b id="eta-text">15.00 WIB</b> &nbsp;·&nbsp; Sekarang <b id="now-text">--.--.--</b></span>
    <span class="credit">Foto: オーバードライブ83 / <a href="https://commons.wikimedia.org/wiki/File:2022_Toyota_Kijang_Innova_Zenix_2.0_V_MAGA10R_(20230709).jpg">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a></span>
  </div>
</main>

<script>
(() => {
  // Arrival: 15:00 WIB (UTC+7). Override for testing with ?at=YYYY-MM-DDTHH:MM (read as WIB).
  const WIB = 7 * 3600e3;
  const params = new URLSearchParams(location.search);
  const parseWib = s => { const t = Date.parse(s + (s.length <= 16 ? ':00' : '') + 'Z'); return isNaN(t) ? null : t - WIB; };
  const target = (params.get('at') && parseWib(params.get('at'))) || Date.UTC(2026, 9, 15, 8, 0, 0);

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const pad = n => String(n).padStart(2, '0');
  const fmt = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const fmtEta = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hour12: false });
  $('eta-text').textContent = fmtEta.format(target).replace(' pukul', ',') + ' WIB';

  const set = (id, v) => {
    const el = $(id), span = el.firstElementChild;
    if (span.textContent === v) return;
    const next = document.createElement('span');
    next.textContent = v; next.className = 'tick';
    el.replaceChild(next, span);
  };

  let arrived = false;
  function tick() {
    const now = Date.now();
    $('now-text').textContent = fmt.format(now).replace(/:/g, '.');
    const diff = Math.max(0, target - now);
    const s = Math.floor(diff / 1000);
    const d = Math.floor(s / 86400);
    $('u-days').hidden = d === 0;
    $('timer').classList.toggle('has-days', d > 0);
    set('d-days', pad(d));
    set('d-hours', pad(Math.floor(s / 3600) % 24));
    set('d-mins', pad(Math.floor(s / 60) % 60));
    set('d-secs', pad(s % 60));
    if (s <= 600 && !arrived) $('status-text').textContent = s <= 60 ? 'Hampir Tiba' : 'Segera Tiba';
    if (diff === 0 && !arrived) arrive();
  }

  function arrive() {
    arrived = true;
    stage.classList.add('arrived');
    $('status-text').textContent = 'Telah Tiba';
    document.title = 'Zenix Telah Tiba';
    burst();
  }

  // ---------- gold sparks ----------
  const cv = $('sparks'), ctx = cv.getContext('2d');
  let W, H, dpr, parts = [];
  const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; };
  addEventListener('resize', resize); resize();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ambient = () => ({ x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * .15 * dpr, vy: -(.15 + Math.random() * .45) * dpr, r: (.4 + Math.random() * 1.3) * dpr, life: 1, decay: .0015 + Math.random() * .002, g: 0 });
  for (let i = 0; i < 45; i++) { const p = ambient(); p.y = Math.random() * H; parts.push(p); }
  function burst() {
    if (reduce) return;
    for (let k = 0; k < 3; k++) setTimeout(() => {
      const cx = W * (.2 + Math.random() * .6), cy = H * (.2 + Math.random() * .3);
      for (let i = 0; i < 160; i++) {
        const a = Math.random() * Math.PI * 2, v = (1 + Math.random() * 6) * dpr;
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: (.8 + Math.random() * 2) * dpr, life: 1, decay: .006 + Math.random() * .01, g: .04 * dpr });
      }
    }, k * 650);
    setTimeout(burst, 9000);
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowBlur = 8 * dpr; ctx.shadowColor = 'rgba(212,179,112,.9)';
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; if (p.g) p.vx *= .985; p.life -= p.decay;
      ctx.fillStyle = `rgba(243,223,166,${Math.max(0, p.life) * .85})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    parts = parts.filter(p => p.life > 0 && p.y > -20);
    let amb = 0; for (const p of parts) if (!p.g) amb++;
    while (amb++ < 45) parts.push(ambient());
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();

  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
